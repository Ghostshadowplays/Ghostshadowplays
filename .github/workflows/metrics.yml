# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: metrics-update
      cancel-in-progress: true

    steps:
      - uses: lowlighter/metrics@c6f1c0f5f3c1c2f6b7a4e2c7b8f4a9d1e2b3c4d5
        with:
          token: ${{ secrets.GH_PAT }}
          plugins_errors_fatal: no
        
          user: Ghostshadowplays
          template: classic
          base: header, community, repositories, metadata
          config_timezone: Europe/London

          plugin_introduction: yes
          plugin_introduction_title: yes

          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 28

          plugin_repositories: yes
          plugin_repositories_affiliations: owner, collaborator

          plugin_gists: yes
          plugin_starlists: yes

          plugin_discussions: yes
          plugin_discussions_categories_limit: 8

          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons

          plugin_code: yes
          plugin_code_languages: yes
          plugin_code_load: 400

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 365
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors-graphs, os-graphs
          plugin_wakatime_languages_ignored: markdown, plaintext, text, xml, yaml, JSON
          plugin_wakatime_limit: 5
          plugin_wakatime_url: https://wakatime.com
          plugin_wakatime_user: current
          plugin_wakatime_languages_other: yes

          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 12

          plugin_followup: yes

          plugin_lines: yes
          plugin_lines_sections: "history, repositories"

          filename: metrics.svg
